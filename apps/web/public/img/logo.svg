<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.4 -0.15 64 64" fill="none" role="img" aria-label="ProcureFlow">
  <!-- Letter "P": the stem is the bowl's left vertical, so the two read as one
       glyph. Bowl centre (33.4, 24), outer r 18.6, inner r 9.2; the stem's
       right edge (x 24.2) is exactly the bowl's inner-left edge. -->

  <!-- stem: full height, rounded foot, flush with the bowl's inner edge -->
  <path d="M14.8 24 V53.6 a4.7 4.7 0 0 0 9.4 0 V24 Z" fill="#1481ff"/>

  <!-- bowl, four segments; the left ones start at the stem's outer edge -->
  <!-- upper-left: red -->
  <path d="M33.4 5.4 A18.6 18.6 0 0 0 14.8 24 H24.2 A9.2 9.2 0 0 1 33.4 14.8 Z" fill="#ff2d2e"/>
  <!-- lower-left: orange -->
  <path d="M14.8 24 A18.6 18.6 0 0 0 33.4 42.6 V33.2 A9.2 9.2 0 0 1 24.2 24 Z" fill="#ff9108"/>
  <!-- lower-right: blue -->
  <path d="M52 24 A18.6 18.6 0 0 1 33.4 42.6 V33.2 A9.2 9.2 0 0 0 42.6 24 Z" fill="#2898e4"/>
  <!-- upper-right: green, stopping short of 12 o'clock to leave the arrow gap -->
  <path d="M46.5 10.9 A18.6 18.6 0 0 1 52 24 H42.6 A9.2 9.2 0 0 0 40 17.4 Z" fill="#43ad54"/>

  <!-- gold arrowhead closing the bowl's opening, pointing clockwise -->
  <path d="M33.4 5.4 L46.5 10.9 L40 17.4 Z" fill="#ffc002"/>
</svg>
