name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        run: npm --prefix frontend ci

      - name: Install API dependencies
        run: npm --prefix functions/procurement_api ci

      # Backend suites (run the real Express app against a stubbed Catalyst),
      # the /api/v1 end-to-end suite, then tsc and the Vite build.
      - name: Verification gate
        run: bash verification/verify.sh
