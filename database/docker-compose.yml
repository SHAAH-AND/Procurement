version: '3.8'

services:
  # Backend (NestJS)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=change-this-to-a-secure-random-secret-in-production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=procurement
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./dist:/app/dist
      - ./node_modules:/app/node_modules
    restart: unless-stopped

  # Frontend (Vite)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
      - PORT=5174
    depends_on:
      - backend
    volumes:
      - ./dist:/app/dist
      - ./src:/app/src
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=procurement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
