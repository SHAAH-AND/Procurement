<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content Security Policy. Scripts may only come from this origin and the
         Zoho CDN that serves the Catalyst web SDK; the Catalyst bootstrap
         (/__catalyst/sdk/init.js) is same-origin. Styles allow inline because
         the UI sets style attributes at runtime. connect-src covers the API on
         this origin plus Catalyst/Zoho hosts used by the SDK; frame-src is what
         the embedded Zoho Accounts sign-in renders in. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://static.zohocdn.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: blob: https:;
      connect-src 'self' https://procurement.cloudhub.lk https://*.catalystserverless.com https://*.zohostratus.com https://*.zohoportal.com https://*.zoho.com https://*.zohocdn.com;
      frame-src 'self' https://accounts.zoho.com https://*.zoho.com https://*.catalystserverless.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self' https://accounts.zoho.com">
    <link rel="icon" type="image/png" href="./img/procureflow-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ProcureFlow — hospitality-native procurement for hotel groups. Requisitions, approvals, purchase orders, receiving and 3-way matching in one calm flow." />
    <title>ProcureFlow — Procurement Platform</title>
    <!-- Catalyst web SDK: hosted authentication (embedded Zoho Accounts sign-in)
         and the per-request auth token the API expects. init.js is generated
         by Catalyst for this project and environment. -->
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.1/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
