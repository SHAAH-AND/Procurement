<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" fill="none" stroke="#C3D4F5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- cube -->
  <g transform="translate(60,50) rotate(-12)">
    <path d="M0 -11 L9.5 -5.5 V5.5 L0 11 L-9.5 5.5 V-5.5 Z"/><path d="M0 0 L9.5 -5.5 M0 0 V11 M0 0 L-9.5 -5.5"/>
  </g>
  <!-- cart -->
  <g transform="translate(180,80) rotate(8)">
    <circle cx="-6" cy="9" r="1.6"/><circle cx="7" cy="9" r="1.6"/><path d="M-12 -8 H-9 L-6.5 6 H7 L10.5 -4 H-8"/>
  </g>
  <!-- receipt -->
  <g transform="translate(310,55) rotate(10)">
    <path d="M-7 -12 H7 V12 L3.5 10 L0 12 L-3.5 10 L-7 12 Z"/><path d="M-4 -6 H4 M-4 -2 H4 M-4 2 H2"/>
  </g>
  <!-- clock -->
  <g transform="translate(420,90) rotate(0)">
    <circle cx="0" cy="0" r="10"/><path d="M0 -5 V0 L4 2.5"/>
  </g>
  <!-- check circle -->
  <g transform="translate(110,170) rotate(0)">
    <circle cx="0" cy="0" r="10"/><path d="M-4.5 0.5 L-1.5 3.5 L5 -3"/>
  </g>
  <!-- truck -->
  <g transform="translate(240,180) rotate(-6)">
    <path d="M-13 -5 H3 V6 H-13 Z M3 -2 H8 L11 1 V6 H3"/><circle cx="-8" cy="8" r="1.8"/><circle cx="7" cy="8" r="1.8"/>
  </g>
  <!-- box / package -->
  <g transform="translate(360,185) rotate(14)">
    <path d="M-9 -6 H9 V8 H-9 Z M-9 -6 L-5 -11 H13 L9 -6 M9 -6 L13 -11"/><path d="M0 -6 V8"/>
  </g>
  <!-- clipboard check -->
  <g transform="translate(30,110) rotate(6)">
    <rect x="-8" y="-10" width="16" height="21" rx="2"/><path d="M-4 -10 V-12 H4 V-10 M-4 0 L-1 3 L5 -3"/>
  </g>
  <!-- small cube -->
  <g transform="translate(285,235) rotate(-18)">
    <path d="M0 -8 L7 -4 V4 L0 8 L-7 4 V-4 Z"/><path d="M0 0 L7 -4 M0 0 V8 M0 0 L-7 -4"/>
  </g>
  <!-- small check -->
  <g transform="translate(160,225) rotate(0)">
    <circle cx="0" cy="0" r="8"/><path d="M-3.5 0.5 L-1 3 L4 -2.5"/>
  </g>
  <!-- tag -->
  <g transform="translate(430,220) rotate(-10)">
    <path d="M-8 -3 L2 -9 H9 V0 L-1 8 Z"/><circle cx="4" cy="-4" r="1.4"/>
  </g>
  <!-- doc -->
  <g transform="translate(55,235) rotate(8)">
    <path d="M-6 -11 H4 L8 -7 V11 H-6 Z M4 -11 V-7 H8 M-3 -3 H5 M-3 1 H5 M-3 5 H3"/>
  </g>
</svg>
